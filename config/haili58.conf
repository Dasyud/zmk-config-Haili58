# User Configuration for ${keyboard.name}

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse Emulation Behaviors
CONFIG_ZMK_POINTING=y

# Soft Off Behavior
CONFIG_ZMK_PM_SOFT_OFF=y

CONFIG_ZMK_DISPLAY=y

# ZMK Studio: connect without needing a &studio_unlock keypress
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Power: deep sleep is OFF by default in ZMK, which is the main idle drain.
# Both halves power down after this much inactivity and wake on a keypress.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000