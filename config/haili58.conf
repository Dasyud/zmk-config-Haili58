# User Configuration for ${keyboard.name}

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse Emulation Behaviors
CONFIG_ZMK_POINTING=y

# Soft Off Behavior
CONFIG_ZMK_PM_SOFT_OFF=y

# OLED off: the SSD1306s draw far more than the rest of the board while awake,
# and only showed the layer name. Set to y to bring them back.
CONFIG_ZMK_DISPLAY=n

# ZMK Studio: connect without needing a &studio_unlock keypress
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Power: deep sleep is OFF by default in ZMK, which is the main idle drain.
# Both halves power down after this much inactivity and wake on a keypress.
# Waking is a reboot plus Bluetooth reconnect (a few seconds, first key lost),
# so 30 min keeps it from sleeping during reading pauses.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
